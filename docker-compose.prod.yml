services:
  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      DB_NAME: trello_clone
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
