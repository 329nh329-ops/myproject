services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trello_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - trello-clone-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trello_clone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trello-clone-db-data:
